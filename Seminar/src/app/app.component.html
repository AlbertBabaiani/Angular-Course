<div class="container mt-5">

  <app-search (value)="getSearchValue($event)" />
  
  <app-filter (filter)="getFilterType($event)" />
  

  <app-products-list
  #productsList
  [getSearchValue]="searchedValue"
  [getFilterType]="filteredType"
  />

  @if(productsList.selectedProduct){
    <app-product-details
    appClickOutside

    [product]="productsList.selectedProduct"
    (closeTabEmitter)="productsList.selectedProduct = $event"/>
  }


</div>
